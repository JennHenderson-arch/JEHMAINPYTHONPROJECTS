name: Playwright Tests
# This workflow runs Playwright tests on a schedule, on pull requests, and on demand. It includes separate jobs for nightly smoke tests, nightly API tests, fast PR checks, and a full regression suite that can be triggered manually. Artifacts from the smoke and regression tests are uploaded for later analysis.
# 20260602 - JEH - Initial version of workflow created.

on:
  # --- Nightly Smoke Tests (4 AM EST = 09:00 UTC) ---
  schedule:
    - cron: "0 4 * * *" # Actually - '0 9 * * *' seems to run at 9 local time, so this should be 4 AM EST. Will need to verify this.

  # --- Fast Tests on Pull Requests ---
  pull_request:
    branches: [ main ]

  # --- Full Regression On Demand ---
  workflow_dispatch:

jobs:

  # ============================
  # Nightly Smoke Test Job
  # ============================
  nightly-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Smoke Tests
        run: pytest tests -m smoke --tracing=on

      - name: Upload Smoke Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          path: test-results/

  # ============================
  # Nightly API Test Job
  # ============================
  nightly-api:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API Tests
        run: pytest tests -m api

  # ============================
  # Fast PR Checks
  # ============================
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Fast Tests (Smoke + API)
        run: pytest tests -m "smoke or api"

  # ============================
  # Full Regression (Manual Trigger)
  # ============================
  full-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Full Regression Suite
        run: pytest tests --tracing=on  ## Note: No marker filter means all tests will run, including regression tests. May want to explicitly use '-m regression' if you want to only run regression tests.

      - name: Upload Regression Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: test-results/

  # ============================
  # Regression on Every Push
  # ============================
  push-regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Regression Tests
        run: pytest tests -m regression --tracing=on

      - name: Upload Regression Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: test-results/
